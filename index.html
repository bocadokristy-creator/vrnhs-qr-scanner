<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VRNHS Student Entry Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    h1 {
      color: #123b63;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #555;
      margin-top: 0;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
      background: white;
      border-radius: 12px;
      padding: 10px;
      box-sizing: border-box;
    }

    #result {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
      padding: 20px;
      background: white;
      border-radius: 12px;
      box-sizing: border-box;
      min-height: 150px;
    }

    .success {
      color: #16803c;
    }

    .error {
      color: #c62828;
    }

    .student-name {
      font-size: 24px;
      font-weight: bold;
      margin: 15px 0;
    }

    .details {
      font-size: 18px;
      line-height: 1.7;
    }

    .qr-value {
      font-size: 20px;
      font-weight: bold;
    }

    .loading {
      color: #555;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <h1>VRNHS STUDENT ENTRY</h1>

  <p class="subtitle">
    8-De Leon QR Attendance
  </p>

  <div id="reader"></div>

  <div id="result">
    <p>Ready to scan...</p>
  </div>


<script>

/*
====================================================
IMPORTANT:
PASTE YOUR EXISTING APPS SCRIPT WEB APP URL BELOW
====================================================
*/

const APP_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbw6Yd4QT3X47YD2BqZb5qD9Dv3UZ3qtmChC00DbjMdv1sHAQIbJq5wSfTeUfoqOKOB2/exec";


let isProcessing = false;


function onScanSuccess(decodedText, decodedResult) {

  if (isProcessing) {
    return;
  }

  isProcessing = true;

  const qrId = decodedText.trim();

  document.getElementById("result").innerHTML =
    '<div class="loading">' +
    '<h2>Checking student...</h2>' +
    '<p>QR ID: <b>' + qrId + '</b></p>' +
    '</div>';


  /*
  ==================================================
  SEND QR ID TO GOOGLE APPS SCRIPT
  ==================================================
  */

  const callbackName =
    "vrnhsCallback_" + Date.now();


  window[callbackName] = function(result) {

    try {

      if (result.success) {

        document.getElementById("result").innerHTML =
          '<div class="success">' +

          '<h2>✓ ENTRY RECORDED</h2>' +

          '<div class="student-name">' +
          result.name +
          '</div>' +

          '<div class="details">' +

          '<div><b>Grade:</b> ' +
          result.grade +
          '</div>' +

          '<div><b>Section:</b> ' +
          result.section +
          '</div>' +

          '<div><b>QR ID:</b> ' +
          result.qrId +
          '</div>' +

          '<div><b>Time:</b> ' +
          result.time +
          '</div>' +

          '</div>' +

          '</div>';

      } else {

        document.getElementById("result").innerHTML =
          '<div class="error">' +

          '<h2>✕ NOT RECORDED</h2>' +

          '<p>' +
          result.message +
          '</p>' +

          '</div>';
      }

    } catch (error) {

      document.getElementById("result").innerHTML =
        '<div class="error">' +
        '<h2>System Error</h2>' +
        '<p>' + error + '</p>' +
        '</div>';

    }


    /*
    Reset scanner after 3 seconds
    */

    setTimeout(function() {

      isProcessing = false;

      document.getElementById("result").innerHTML =
        "<p>Ready to scan next student...</p>";

    }, 3000);


    delete window[callbackName];
  };


  /*
  ==================================================
  CREATE JSONP REQUEST
  ==================================================
  */

  const script = document.createElement("script");

  script.src =
    APP_SCRIPT_URL +
    "?action=record" +
    "&qrId=" +
    encodeURIComponent(qrId) +
    "&callback=" +
    callbackName;

  script.onerror = function() {

    document.getElementById("result").innerHTML =
      '<div class="error">' +
      '<h2>Connection Error</h2>' +
      '<p>Unable to connect to the attendance server.</p>' +
      '</div>';

    setTimeout(function() {

      isProcessing = false;

      document.getElementById("result").innerHTML =
        "<p>Ready to scan next student...</p>";

    }, 3000);

  };


  document.body.appendChild(script);

}


function onScanFailure(error) {
  // Normal scanning failures are ignored.
}


/*
====================================================
START CAMERA
====================================================
*/

const html5QrCode = new Html5Qrcode("reader");

const config = {

  fps: 10,

  qrbox: {
    width: 280,
    height: 280
  },

  aspectRatio: 1.0
};


Html5Qrcode.getCameras()

  .then(devices => {

    if (devices && devices.length) {

      let cameraId = devices[0].id;

      /*
      Prefer the rear camera
      */

      if (devices.length > 1) {
        cameraId = devices[devices.length - 1].id;
      }


      html5QrCode.start(

        cameraId,

        config,

        onScanSuccess,

        onScanFailure

      );

    } else {

      document.getElementById("result").innerHTML =
        '<div class="error">' +
        '<h3>No camera found.</h3>' +
        '</div>';

    }

  })

  .catch(err => {

    document.getElementById("result").innerHTML =
      '<div class="error">' +
      '<h3>Camera permission required.</h3>' +
      '<p>' + err + '</p>' +
      '</div>';

  });

</script>

</body>
</html>
