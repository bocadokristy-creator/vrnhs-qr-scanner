<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VRNHS Student Entry Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    h1 {
      color: #123b63;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #555;
      margin-top: 0;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
      background: white;
      border-radius: 12px;
      padding: 10px;
      box-sizing: border-box;
    }

    #result {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
      padding: 20px;
      background: white;
      border-radius: 12px;
      box-sizing: border-box;
      min-height: 120px;
    }

    .success {
      color: #16803c;
    }

    .error {
      color: #c62828;
    }

    .student-name {
      font-size: 22px;
      font-weight: bold;
      margin: 10px 0;
    }

    .details {
      font-size: 17px;
      line-height: 1.6;
    }

    .time {
      font-size: 20px;
      font-weight: bold;
      margin-top: 10px;
    }

    button {
      font-size: 16px;
      padding: 12px 20px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h1>VRNHS STUDENT ENTRY</h1>

  <p class="subtitle">
    8-De Leon QR Attendance
  </p>

  <div id="reader"></div>

  <div id="result">
    <p>Ready to scan...</p>
  </div>

<script>

let isProcessing = false;

function onScanSuccess(decodedText) {

  if (isProcessing) {
    return;
  }

  isProcessing = true;

  document.getElementById("result").innerHTML =
    "<p>Checking student...</p>";

  /*
    IMPORTANT:
    We will connect this part to your
    Google Apps Script after the webpage
    is successfully working.
  */

  console.log("QR scanned:", decodedText);

  document.getElementById("result").innerHTML =
    '<div class="success">' +
    '<h2>✓ QR SCANNED</h2>' +
    '<div class="student-name">' +
    decodedText +
    '</div>' +
    '<p>Scanner is working.</p>' +
    '</div>';

  setTimeout(function() {

    isProcessing = false;

    document.getElementById("result").innerHTML =
      "<p>Ready to scan next student...</p>";

  }, 2000);

}

function onScanFailure(error) {
  // Normal scanning failures are ignored.
}

const scanner = new Html5QrcodeScanner(
  "reader",
  {
    fps: 10,
    qrbox: {
      width: 250,
      height: 250
    }
  },
  false
);

scanner.render(
  onScanSuccess,
  onScanFailure
);

</script>

</body>
</html>
