<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VRNHS Student Entry Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    h1 {
      color: #123b63;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #555;
      margin-top: 0;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
      background: white;
      border-radius: 12px;
      padding: 10px;
      box-sizing: border-box;
    }

    #result {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
      padding: 20px;
      background: white;
      border-radius: 12px;
      box-sizing: border-box;
      min-height: 120px;
    }

    .success {
      color: #16803c;
    }

    .error {
      color: #c62828;
    }

    .qr-value {
      font-size: 28px;
      font-weight: bold;
      margin: 15px 0;
    }

    .time {
      font-size: 18px;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <h1>VRNHS STUDENT ENTRY</h1>

  <p class="subtitle">
    8-De Leon QR Attendance
  </p>

  <div id="reader"></div>

  <div id="result">
    <p>Ready to scan...</p>
  </div>

<script>

let isProcessing = false;

function onScanSuccess(decodedText, decodedResult) {

  if (isProcessing) {
    return;
  }

  isProcessing = true;

  document.getElementById("result").innerHTML =
    '<div class="success">' +
    '<h2>✓ QR SCANNED</h2>' +
    '<div class="qr-value">' +
    decodedText +
    '</div>' +
    '<p>QR code successfully detected.</p>' +
    '</div>';

  console.log("QR Code:", decodedText);

  setTimeout(function() {
    isProcessing = false;

    document.getElementById("result").innerHTML =
      "<p>Ready to scan next student...</p>";

  }, 2500);
}

function onScanFailure(error) {
  // Ignore normal scanning failures.
}

const html5QrCode = new Html5Qrcode("reader");

const config = {
  fps: 10,
  qrbox: {
    width: 280,
    height: 280
  },
  aspectRatio: 1.0
};

Html5Qrcode.getCameras()
  .then(devices => {

    if (devices && devices.length) {

      let cameraId = devices[0].id;

      // Prefer the back camera when available
      if (devices.length > 1) {
        cameraId = devices[devices.length - 1].id;
      }

      html5QrCode.start(
        cameraId,
        config,
        onScanSuccess,
        onScanFailure
      );

    } else {

      document.getElementById("result").innerHTML =
        '<div class="error">' +
        '<h3>No camera found.</h3>' +
        '</div>';

    }

  })
  .catch(err => {

    document.getElementById("result").innerHTML =
      '<div class="error">' +
      '<h3>Camera permission required.</h3>' +
      '<p>' + err + '</p>' +
      '</div>';

  });

</script>

</body>
</html>
